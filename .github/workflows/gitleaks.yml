name: gitleaks

# Mandatory secret scan. The job name "Secret scan" is the required status check
# in the repository ruleset - do not rename it without updating the ruleset.
on:
  push: # every branch and tag
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bump both together. The checksum comes from the release's
      # gitleaks_<version>_checksums.txt (linux_x64 entry).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans every commit reachable from the checked-out ref, using .gitleaks.toml.
      # Fails the job (exit 1) on any finding; secrets are redacted in the log.
      - name: Scan git history
        run: gitleaks git . --redact --verbose --no-banner --platform github
